[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rv-docx-rs"
version = "0.1.0"
description = "CMI-compatible declarative Python bindings for the Rust DOCX engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LGPL-2.1-or-later" }
dependencies = ["python-docx==1.2.0"]

[dependency-groups]
test = ["pytest>=8,<10", "pytest-asyncio>=1.3,<2", "cmi-docx"]

[tool.uv.sources]
cmi-docx = { git = "https://github.com/childmindresearch/cmi-docx", rev = "3449b942034129ad74a28aeb253361035806e385" }

[tool.maturin]
python-source = "python"
module-name = "rv_docx._native"
features = ["python-bindings", "pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "assets/*" },
    { file = "python/**/*.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python_bindings"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
