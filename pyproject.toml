[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rocx"
version = "0.2.0"
description = "Declarative Python authoring for the native Rust DOCX engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LGPL-2.1-or-later" }
dependencies = []

[project.optional-dependencies]
interop = ["python-docx==1.2.0"]

[project.urls]
Repository = "https://github.com/ReinderVosDeWael/rv-docx-rs"

[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.14",
    "mkdocstrings-python==1.16.12",
]
test = ["pytest>=8,<10", "pytest-asyncio>=1.3,<2", "cmi-docx"]

[tool.uv.sources]
cmi-docx = { git = "https://github.com/childmindresearch/cmi-docx", rev = "3449b942034129ad74a28aeb253361035806e385" }

[tool.maturin]
python-source = "python"
module-name = "rocx._native"
features = ["python-bindings", "pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "assets/*" },
    { file = "python/**/*.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests/python_bindings"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
