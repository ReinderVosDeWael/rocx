[package]
name = "rocx-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# The packed Wasm source is replayed independently with its own lockfile.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
rocx = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
