[package]
name = "rocx-js-experimental-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Checkout-only Wasm build. The npm workspace and its source replay do not
# resolve the layout dependency or include the experimental exports.
[workspace]

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
js-sys = "0.3"
rocx = { path = "../.." }
rocx-layout = { path = "../../crates/rocx-layout" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde_json = "1"
