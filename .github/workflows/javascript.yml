name: Packed JavaScript consumer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      ROCX_SCHEMA_DIR: ${{ github.workspace }}/.validation-schemas
      ROCX_INSTALL_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: javascript/tests/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked --group test
      - if: matrix.node == '22'
        run: python javascript/tests/test_packed_scratch.py
      - uses: actions/cache@v6.1.0
        id: schemas
        with:
          path: ${{ env.ROCX_SCHEMA_DIR }}
          key: official-schemas-${{ hashFiles('tools/validate_ooxml.py') }}
      - if: steps.schemas.outputs.cache-hit != 'true'
        run: uv run --no-sync python tools/validate_ooxml.py --download-schemas
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Compare experimental layout Wasm against native geometry
        if: matrix.node == '22'
        run: |
          set -eu
          scratch=$(mktemp -d "$RUNNER_TEMP/layout.XXXXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          manifest=javascript/experimental-layout/Cargo.toml
          font=crates/rocx-layout/tests/fonts/DejaVuSans-subset.ttf
          cargo fmt --manifest-path "$manifest" --check
          cargo clippy --locked --manifest-path "$manifest" --target wasm32-unknown-unknown --target-dir target -- -D warnings
          cargo build --locked --release --manifest-path "$manifest" --target wasm32-unknown-unknown --target-dir target
          wasm-bindgen --target web --out-dir "$scratch/pkg" --out-name rocx target/wasm32-unknown-unknown/release/rocx_js_experimental_layout.wasm
          echo '{"type":"module"}' > "$scratch/package.json"
          cargo run --locked --quiet --manifest-path "$manifest" --target-dir target --example fixture -- "$font" > "$scratch/fixture.json"
          node javascript/experimental-layout/test.mjs "$scratch/pkg/rocx.js" "$font" "$scratch/fixture.json"
          node --test javascript/experimental-layout/demo/protocol.test.mjs
          cp javascript/experimental-layout/types.mts "$scratch/"
          npm --prefix "$scratch" exec --yes --package typescript@5.9.3 -- tsc --noEmit --strict --module nodenext --lib esnext,dom "$scratch/types.mts"
      - name: Exercise the layout worker, page clicks and DOCX downloads in Firefox
        if: matrix.node == '22'
        run: .venv/bin/python tools/serve_layout_demo.py --smoke
      - run: cargo fmt --manifest-path javascript/Cargo.toml --check
      - run: cargo clippy --manifest-path javascript/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - id: packed
        # The toolchain action sets CARGO_INCREMENTAL; verify the shipped source
        # with Cargo's unmodified release defaults, as local consumers do.
        run: env -u CARGO_INCREMENTAL bash javascript/tests/check-packed.sh --keep-output
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rocx-docx-node-${{ matrix.node }}
          path: ${{ steps.packed.outputs.tarball }}
          if-no-files-found: error
