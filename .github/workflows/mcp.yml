name: Installed MCP stdio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: ["1.88.0", stable]
    env:
      ROCX_SCHEMA_DIR: ${{ github.workspace }}/.validation-schemas
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set installed test paths
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rocx-mcp-build"
            echo "ROCX_MCP_INSTALL_PREFIX=$RUNNER_TEMP/rocx-mcp-install"
            echo "ROCX_MCP_BINARY=$RUNNER_TEMP/rocx-mcp-install/bin/rocx-mcp"
            echo "ROCX_MCP_ORACLE=$RUNNER_TEMP/rocx-mcp-build/debug/examples/mcp_byte_oracle"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
      - run: cargo fmt --all --check
      - run: cargo test --locked -p rocx-mcp --all-targets
      - run: cargo clippy --locked -p rocx-mcp --all-targets -- -D warnings
      - run: cargo install --locked --path crates/rocx-mcp --root "$ROCX_MCP_INSTALL_PREFIX"
      - run: cargo build --locked -p rocx-mcp --example mcp_byte_oracle
      - uses: actions/cache@v6.1.0
        id: schemas
        with:
          path: ${{ env.ROCX_SCHEMA_DIR }}
          key: official-schemas-${{ hashFiles('tools/validate_ooxml.py') }}
      - if: steps.schemas.outputs.cache-hit != 'true'
        run: uv run --no-project --with-requirements tests/mcp/requirements.txt python tools/validate_ooxml.py --download-schemas
      - run: uv run --no-project --with-requirements tests/mcp/requirements.txt pytest -q -p no:cacheprovider tests/mcp
