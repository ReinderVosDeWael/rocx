name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_crates_oidc:
        description: Verify crates.io trusted-publisher authentication without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROCX_SCHEMA_DIR: ${{ github.workspace }}/.validation-schemas
      ROCX_REQUIRE_SCHEMAS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Check tag and package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/check_release.py
      - run: uv sync --locked --group test
      - run: cargo fmt --check
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Verify the crate package
        run: cargo publish --dry-run --locked
      - name: Smoke-test packaged crate quickstart
        run: |
          cargo package --locked
          python tools/smoke_release_artifacts.py --crate "target/package/rocx-$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])").crate"
      - uses: actions/cache@v6.1.0
        id: schemas
        with:
          path: ${{ env.ROCX_SCHEMA_DIR }}
          key: official-schemas-${{ hashFiles('tools/validate_ooxml.py') }}
      - if: steps.schemas.outputs.cache-hit != 'true'
        run: uv run --no-sync python tools/validate_ooxml.py --download-schemas
      - run: uv run --no-sync pytest
      - run: cargo run --locked --example feature_parity -- "${{ runner.temp }}/features.docx"
      - run: uv run --no-sync python tools/validate_ooxml.py "${{ runner.temp }}/features.docx"
      - run: uv run --no-sync python tools/check_wheel.py
      - name: Check for unintended changes
        run: git diff --exit-code
  wheels:
    name: Wheels (${{ matrix.label }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            manylinux: "2_17"
            args: --release --locked --out dist --compatibility pypi -i python3.12
          - label: windows-x86_64
            runner: windows-latest
            args: --release --locked --out dist --compatibility pypi
          - label: macos-universal2
            runner: macos-latest
            args: --release --locked --out dist --target universal2-apple-darwin --compatibility pypi
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Add macOS universal2 targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.16.0
          manylinux: ${{ matrix.manylinux }}
          args: ${{ matrix.args }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Smoke-test the wheel
        shell: bash
        run: python tools/smoke_release_artifacts.py --wheel dist/*.whl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          maturin-version: v1.16.0
          args: --out dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  npm-package:
    name: Qualify npm tarball
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROCX_SCHEMA_DIR: ${{ github.workspace }}/.validation-schemas
      ROCX_INSTALL_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked --group test
      - uses: actions/cache@v6.1.0
        id: schemas
        with:
          path: ${{ env.ROCX_SCHEMA_DIR }}
          key: official-schemas-${{ hashFiles('tools/validate_ooxml.py') }}
      - if: steps.schemas.outputs.cache-hit != 'true'
        run: uv run --no-sync python tools/validate_ooxml.py --download-schemas
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - id: packed
        run: env -u CARGO_INCREMENTAL bash javascript/tests/check-packed.sh
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: |
            ${{ steps.packed.outputs.tarball }}
            ${{ steps.packed.outputs.provenance }}
          if-no-files-found: error

  verify-crates-oidc:
    name: Verify crates.io OIDC
    if: (github.event_name == 'workflow_dispatch' && inputs.verify_crates_oidc) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: rust-lang/crates-io-auth-action@v1.0.6

  publish-npm:
    name: Publish npm package
    needs: [validate, wheels, sdist, npm-package, verify-crates-oidc]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/rocx-docx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: dist
      - name: Stage first version or publish through OIDC
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifact="./dist/rocx-docx-$version.tgz"
          node --input-type=module - "$artifact" <<'JS'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { basename } from "node:path";
          const artifact = process.argv[2];
          const report = JSON.parse(readFileSync("dist/provenance.json", "utf8"));
          const digest = createHash("sha256").update(readFileSync(artifact)).digest("hex");
          if (report.status !== "qualified" || report.tarball.name !== basename(artifact) || report.tarball.sha256 !== digest) {
            throw new Error("Downloaded npm tarball does not match the qualification report");
          }
          JS
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm stage publish "$artifact" --access public --ignore-scripts
          else
            npm publish "$artifact" --access public --ignore-scripts
          fi

  publish-pypi:
    name: Publish Python package
    needs: [validate, wheels, sdist, npm-package, verify-crates-oidc]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/rocx/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdist
          path: dist
      - name: List distributions
        run: ls -lh dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  publish-crate:
    name: Publish Rust crate
    needs: [validate, wheels, sdist, npm-package, verify-crates-oidc]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/rocx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
