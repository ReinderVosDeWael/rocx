[package]
name = "rocx-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "LGPL-2.1-or-later"
description = "Experimental incremental text layout for rocx editors"

[dependencies]
rocx = { path = "../..", features = ["layout-bridge"] }
lru = { version = "0.16", default-features = false }
rustybuzz = "0.20"
serde = { version = "1", features = ["derive", "rc"] }
unicode-segmentation = "=1.12.0"

[dev-dependencies]
serde_json = "1"
