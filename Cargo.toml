[package]
name = "rocx"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Declarative DOCX authoring with a pure document domain and native OOXML compilation"
license = "LGPL-2.1-or-later"
readme = "README.md"
repository = "https://github.com/ReinderVosDeWael/rocx"
homepage = "https://reindervosdewael.github.io/rocx/"
documentation = "https://reindervosdewael.github.io/rocx/"
exclude = [
    "/crates/rocx-mcp/",
    "/docs/MCP-PLAN.md",
    "/docs/MCP-EDITOR-PARITY.md",
    "/docs/PLAN.md",
    "/docs/ROADMAP-HISTORY.md",
    "/javascript/",
    "/tests/mcp/",
    "/tests/mcp_parity/",
    "/tools/mcp_parity_surface.py",
    "/tools/check_mcp_parity.py",
]

[workspace]
members = ["crates/rocx-mcp"]
default-members = ["."]
exclude = ["javascript"]
resolver = "3"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Enables integration tests requiring an external Python + python-docx install.
python-tests = []
python-bindings = ["dep:pyo3"]
# Internal workspace transport bridge, not part of the supported editor API.
mcp-bridge = []

[dependencies]
pyo3 = { version = "0.30", optional = true, features = ["abi3-py312"] }
# ZIP 9.8 raises the minimum Rust version to 1.89.
zip = { version = "~9.7.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-executor = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
